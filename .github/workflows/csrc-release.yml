name: csrc Release

on:
  push:
    branches: [main]
    paths:
      - 'csrc/**'
    tags:
      - 'csrc@*'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-latest
          - platform: darwin-x64
            runner: macos-13
          - platform: win32-x64
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Read csrc Version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < csrc/VERSION)"
          if [[ -z "$version" ]]; then
            echo "csrc/VERSION is empty" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: CMake Build
        shell: bash
        run: |
          cmake -B build csrc/
          JOBS=$(( $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2) / 4 ))
          cmake --build build --config Release -j${JOBS:-1}

      - name: Package Artifact
        shell: bash
        run: |
          addon_path=""
          for candidate in build/coral-vec.node build/Release/coral-vec.node; do
            if [[ -f "$candidate" ]]; then
              addon_path="$candidate"
              break
            fi
          done
          if [[ -z "$addon_path" ]]; then
            echo "coral-vec.node not found after build" >&2
            find build -maxdepth 3 -type f
            exit 1
          fi

          mkdir -p dist
          cp "$addon_path" coral-vec.node
          tar -czf "dist/csrc@${{ steps.version.outputs.value }}-${{ matrix.platform }}.tar.gz" coral-vec.node

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: csrc-${{ matrix.platform }}
          path: dist/csrc@${{ steps.version.outputs.value }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/csrc@')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read csrc Version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < csrc/VERSION)"
          if [[ -z "$version" ]]; then
            echo "csrc/VERSION is empty" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "csrc@$version" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match csrc/VERSION (csrc@$version)" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: csrc-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: csrc@${{ steps.version.outputs.value }}
          name: csrc@${{ steps.version.outputs.value }}
          files: artifacts/*.tar.gz
          fail_on_unmatched_files: true
