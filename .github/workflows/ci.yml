name: CI

# Pull-request gate: the source compiles (tsc + esbuild bundle) and the test
# suite passes, on both supported Node majors. Feature PRs carry source only —
# they do NOT bump the version or rebuild bridge/ (the Release workflow does
# that at release time), so there is no bridge hash check here.
#
# Every job carries `timeout-minutes`. Without it a job inherits the 360-minute
# GitHub default, so a test that spins instead of failing burns six runner-hours
# per Node major and reports nothing useful — which is exactly what a
# catastrophically backtracking regex in an invariant scan did before it was
# caught locally. The budgets below are several times the observed runtime.

# GitHub refuses to merge a draft PR, so a gate run there costs runner time to
# gate a merge that cannot happen. `ready_for_review` is listed explicitly
# because naming `types` replaces the default set — without it, marking a draft
# ready would fire no event and the branch would sit with no result until its
# next push.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  build-and-test:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [26]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Static gates first: they are seconds, they are part of the project's own
      # quality gate, and none of them ran here. `npm run build` typechecks src
      # only, so nothing caught a type error under tests/ — a change that brands
      # or narrows a widely-used type churns fixtures, and only `typecheck:tests`
      # sees them. This step is also the gate's only whole-tree typecheck: see
      # scripts/test.mjs for why `npm test` leaves it to this step under CI.
      - run: npm run typecheck:tests
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm run build
      - run: npm test
      # These reports are the gate's only structured per-case record: the console
      # log carries a passing case's time as text, and only above vitest's 300 ms
      # slow threshold. A case that is about to time out on a slower runner is
      # passing on this one, so the reports are kept for failed runs too, which is
      # where the comparison against the last green run starts.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-reports-node-${{ matrix.node-version }}
          path: reports/
          retention-days: 7
          if-no-files-found: warn
      # `npm test` runs only tests/unit, tests/invariants and the simulation
      # suite. tests/integration was outside the gate entirely, so the
      # cross-version handoff, cold/warm start and IPC suites went unrun and two
      # of them sat red. `test:e2e:build` runs every non-lifecycle e2e file
      # against `clients/build`. Narrowing it to one file leaves the CLI-surface
      # and direct-read suites gated by nothing.
      - run: npm run test:integration
      - run: npm run test:store-reset:integration
      - run: npm run verify:store-reset-build
      - run: npm run test:e2e:build
      - run: npm run test:e2e:lifecycle

  network-test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [26]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:network
