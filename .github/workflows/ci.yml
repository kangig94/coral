name: CI

# Pull-request gate: the source compiles (tsc + esbuild bundle) and the test
# suite passes, on both supported Node majors. Feature PRs carry source only —
# they do NOT bump the version or rebuild bridge/ (the Release workflow does
# that at release time), so there is no bridge hash check here.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  build-and-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Whole integration tier, not just the store-reset file it replaced: 20 of the 21 files under
      # tests/integration were previously never gated by any workflow. Runs in ~2s, and tests that need real
      # sockets or subprocesses live here rather than in the unit tier.
      - run: npm run test:integration
      - run: npm run verify:store-reset-build
      - run: npm run test:e2e:store-reset:build

  network-test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:network
