name: CI

# Pull-request gate: the source compiles (tsc + esbuild bundle) and the test
# suite passes, on both supported Node majors. Feature PRs carry source only —
# they do NOT bump the version or rebuild bridge/ (the Release workflow does
# that at release time), so there is no bridge hash check here.

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run verify:store-reset-build
      - run: npm run test:e2e:store-reset:build

  store-reset-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:store-reset:windows
