world:
  listen:
    port: 4304
  durable:
    - pid: 30404
      runtimeDelayMs: 5
      stdout:
        - delayMs: 20
          data: "handoff-progress\n"
      exit: null
  fakeProvider:
    progress:
      - delayMs: 5
        message: provider-progress-pre-handoff
steps:
  - type: boot
  - type: launch
    prompt: simulate handoff shutdown preserves running job
  - type: wait
    until:
      runtimeRecorded: true
    stepMs: 5
    maxSteps: 5
  - type: wait
    until:
      progressContains: provider-progress-pre-handoff
    stepMs: 5
    maxSteps: 5
  - type: shutdown
    reason: replaced
  - type: expect
    phase: running
    runtimeRecorded: true
    noRealIO: true
