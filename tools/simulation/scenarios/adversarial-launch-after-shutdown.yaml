# Adversarial: launch a job after the backend has shut down.
# Tests whether post-shutdown launch produces a clear error instead of undefined behavior.
world: {}
steps:
  - type: boot
  - type: shutdown
    reason: simulation-shutdown
  - type: launch
    prompt: launch on stopped backend
continueOnFailure: true
expectedFailure:
  stepIndex: 2
  failureKind: exception
